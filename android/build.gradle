buildscript {
    ext.kotlin_version = '1.9.23'
    
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // Android Gradle Plugin - versione compatibile con Flutter
        classpath 'com.android.tools.build:gradle:8.3.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        
        // Eventuali repository aggiuntive se necessario
        // maven { url 'https://jitpack.io' }
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

// Configurazioni globali (se necessario per altri moduli)
ext {
    // Usa compileSdk 34 invece di 36 per maggiore compatibilità
    compileSdkVersion = 34
    targetSdkVersion = 34
    minSdkVersion = 21
    
    // Versioni delle librerie (se usi dipendenze Android native)
    appCompatVersion = "1.6.1"
    materialVersion = "1.11.0"
    constraintLayoutVersion = "2.1.4"
}
