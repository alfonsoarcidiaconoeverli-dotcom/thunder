buildscript {
    ext.kotlin_version = '1.9.23'
    
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // IMPORTANTE: AGP 8.3.2 per Java 17 e SDK 36
        classpath 'com.android.tools.build:gradle:8.3.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

// PROPRIETÀ GLOBALI - QUESTE SONO MANCANTI!
ext {
    compileSdkVersion = 36  // O 34 se vuoi più stabilità
    targetSdkVersion = 36   // O 34
    minSdkVersion = 24      // Flutter default è 19, ma per Java 17 serve almeno 24
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
